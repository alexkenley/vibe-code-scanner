[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibe-scan"
version = "0.3.0"
description = "Lightweight security scanner for AI-generated code"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Alex Kenley"}
]
keywords = ["security", "scanner", "semgrep", "sast", "vibe-coding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "semgrep>=1.56.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
mcp = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sse-starlette>=1.6.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
vibe-scan = "vibe_scan.cli:main"
vibe-scan-mcp = "vibe_scan.mcp_server:main"

[project.urls]
Homepage = "https://github.com/alexkenley/vibe-code-scanner"
Repository = "https://github.com/alexkenley/vibe-code-scanner"
Issues = "https://github.com/alexkenley/vibe-code-scanner/issues"

[tool.hatch.build.targets.wheel]
packages = ["vibe_scan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
